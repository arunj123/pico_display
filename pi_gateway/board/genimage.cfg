image boot.vfat {
  vfat {
    # Force FAT16 so it matches the partition type below
    extraargs = "-F 16 -n BOOT"
  
    files = {
      "bcm2710-rpi-zero-2-w.dtb",
      "rpi-firmware/bootcode.bin",
      "rpi-firmware/cmdline.txt",
      "rpi-firmware/config.txt",
      "rpi-firmware/fixup.dat",
      "rpi-firmware/start.elf",
      "rpi-firmware/overlays",
      "Image"
    }
  }
  size = 32M
}

# Info about creating sdcard image with 3 partitions: boot, rootfs, data (Partition Table: MBR)
image sdcard.img {
  hdimage {
  }

  partition boot {
     # 0xE for W95 FAT16 (LBA). Use 0xC for FAT32 (size > 32MB)
    partition-type = 0xE
    bootable = "true"
    image = "boot.vfat"
  }

  partition rootfs {
    partition-type = 0x83
    image = "rootfs.squashfs"
  }

  partition data {
     # 0xE for W95 FAT16 (LBA). Use 0xC for FAT32 (size > 32MB)
    partition-type = 0xE
    image = "data.vfat"
    size = 64M
  }
}

image data.vfat {
  vfat {
    # -n DATA = Label the disk "DATA"
    extraargs = "-F 16 -n DATA"

    # An empty list {} causes genimage to copy the whole rootfs (Disk Full).
    # Using 'mountpoint' is not supported in this version.
    # So we copy only nedessary files.
    files = { "seedrng" }
  }
  size = 64M
}