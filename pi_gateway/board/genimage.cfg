image boot.vfat {
  vfat {
    files = {
      "bcm2710-rpi-zero-2-w.dtb",
      "rpi-firmware/bootcode.bin",
      "rpi-firmware/cmdline.txt",
      "rpi-firmware/config.txt",
      "rpi-firmware/fixup.dat",
      "rpi-firmware/start.elf",
      "Image"
    }
  }
  size = 32M
}

image sdcard.img {
  hdimage {
  }

  partition boot {
    partition-type = 0xC
    bootable = "true"
    image = "boot.vfat"
  }

  partition rootfs {
    partition-type = 0x83
    image = "rootfs.squashfs"
  }

  partition data {
    partition-type = 0xC
    image = "data.vfat"
    size = 32M
  }
}

image data.vfat {
  vfat {
    extraargs = "-n DATA"
    # We use a placeholder file here to initialize the partition.
    # An empty list {} causes genimage to copy the whole rootfs (Disk Full).
    # Using 'mountpoint' is not supported in this version.
    # So we copy a small existing file to make it work.
    files = { "rpi-firmware/config.txt" }
  }
  size = 32M
}