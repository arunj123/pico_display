name: Buildroot RPi Image Build

on:
  push:
    branches: [ master, main ]
    paths:
      - 'pi_gateway/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - '.github/workflows/buildroot_build.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'pi_gateway/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - '.github/workflows/buildroot_build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      sdk_needed: ${{ steps.filter.outputs.configs == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            configs:
              - 'pi_gateway/configs/**'
              - '.github/workflows/buildroot_build.yml'

  build:
    needs: [changes]
    runs-on: ubuntu-latest
    # Buildroot builds can take a long time
    timeout-minutes: 360

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Buildroot Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential binutils sed make binutils build-essential gcc g++ bash patch gzip bzip2 perl tar cpio unzip rsync file bc wget python3 python3-libusb1 ccache

    - name: Cache Buildroot Downloads
      uses: actions/cache@v4
      with:
        path: dl
        key: ${{ runner.os }}-buildroot-dl-${{ hashFiles('pi_gateway/configs/raspberrypizero2w_64_defconfig') }}
        restore-keys: |
          ${{ runner.os }}-buildroot-dl-

    - name: Cache Buildroot ccache
      uses: actions/cache@v4
      with:
        path: ~/.buildroot-ccache
        key: ${{ runner.os }}-buildroot-ccache-${{ hashFiles('pi_gateway/configs/raspberrypizero2w_64_defconfig') }}
        restore-keys: |
          ${{ runner.os }}-buildroot-ccache-

    - name: Build Image
      run: |
        export REPO_ROOT=$(pwd)
        export BUILDROOT_DIR="${REPO_ROOT}/buildroot"
        export EXTERNAL_TREE="${REPO_ROOT}/pi_gateway"
        export OUTPUT_DIR="${REPO_ROOT}/output"
        export BR_BRANCH="2025.11.x"
        export BR_DL_DIR="${REPO_ROOT}/dl"
        
        # 1. Clone Buildroot if missing
        if [ ! -f "$BUILDROOT_DIR/Makefile" ]; then
            git clone -b $BR_BRANCH https://git.buildroot.net/buildroot $BUILDROOT_DIR
        fi
        
        # 2. Configure
        rm -rf $OUTPUT_DIR
        make -j$(nproc) -C $BUILDROOT_DIR BR2_EXTERNAL="$EXTERNAL_TREE" O="$OUTPUT_DIR" BR2_DL_DIR="$BR_DL_DIR" raspberrypizero2w_64_defconfig
        
        # Enable ccache and set DL dir explicitly
        echo "BR2_CCACHE=y" >> "$OUTPUT_DIR/.config"
        echo "BR2_CCACHE_DIR=\"$HOME/.buildroot-ccache\"" >> "$OUTPUT_DIR/.config"
        echo "BR2_DL_DIR=\"$BR_DL_DIR\"" >> "$OUTPUT_DIR/.config"
        export CCACHE_DIR="$HOME/.buildroot-ccache"
        ccache -M 5G
        
        make -j$(nproc) -C $OUTPUT_DIR olddefconfig
        
        # 3. Build
        make -j$(nproc) -C $OUTPUT_DIR

    - name: Build SDK
      if: needs.changes.outputs.sdk_needed == 'true'
      run: |
        export OUTPUT_DIR="$(pwd)/output"
        make -j$(nproc) -C $OUTPUT_DIR sdk

    - name: Upload SD Image
      uses: actions/upload-artifact@v4
      with:
        name: pi-sd-image
        path: output/images/sdcard.img

    - name: Upload SDK Artifact
      if: needs.changes.outputs.sdk_needed == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: buildroot-sdk
        path: output/images/*_sdk-buildroot.tar.gz

  # build_sdk job removed as it is now merged into build job


