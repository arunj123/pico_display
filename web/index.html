<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pico W Setup</title>
    <link rel="stylesheet" href="style.css">

    <!-- Leaflet Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>

<body>

    <div class="container" id="main-card">
        <div id="status-indicator" class="status-badge">Waiting for connection...</div>

        <h1 id="page-title">Device Setup</h1>
        <p id="page-desc">Make sure your Pico is in Setup Mode (Orange Screen) and Bluetooth is on.</p>

        <!-- CONNECT SCREEN -->
        <div id="connection-ui">
            <button id="connectBtn" class="btn btn-primary">Connect Device</button>
        </div>

        <!-- FORM SCREEN -->
        <div id="form-ui" class="hidden">

            <!-- Wi-Fi Section (Hidden by Default) -->
            <div class="section-header">
                <span>Wi-Fi Settings</span>
                <button type="button" id="wifi-toggle" class="sm-btn">Configure Wi-Fi</button>
            </div>

            <div id="wifi-section" class="hidden">
                <input type="text" id="ssid" placeholder="Network Name (SSID)" autocomplete="off">
                <input type="password" id="password" placeholder="Password" autocomplete="off">
            </div>

            <!-- Location Section -->
            <div class="section-header">Location Data</div>
            <input type="text" id="loc_name" placeholder="Display Label (e.g. Living Room)" autocomplete="off">
            <div style="font-size: 11px; color: #666; text-align: left; margin-bottom: 5px;">
                Label is optional. Coordinates are auto-filled from map or device.
            </div>

            <!-- Map UI -->
            <div id="map"></div>
            <button type="button" id="geoBtn" class="geo-btn">
                <span style="font-size:16px">📍</span> Use My Browser Location
            </button>

            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <input type="number" id="loc_lat" placeholder="Latitude" step="any" readonly
                    style="background-color: #f8f9fa; color: #666;">
                <input type="number" id="loc_lon" placeholder="Longitude" step="any" readonly
                    style="background-color: #f8f9fa; color: #666;">
            </div>

            <button id="saveBtn" class="btn btn-primary">Save & Reboot</button>
            <button id="exitBtn" class="btn btn-danger">Exit Setup Mode</button>
        </div>

        <!-- Log Console -->
        <div id="log-console"></div>
    </div>

    <script src="app.js"></script>
</body>

</html>
